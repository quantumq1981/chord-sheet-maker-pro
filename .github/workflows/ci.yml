name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  # ── Tests ───────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run all tests
        run: npm run test:all

  # ── Type-check & Build ──────────────────────────────────────────────────────
  build:
    name: Type-check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build

  # ── Lint & Format ────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Syntax-check root JS files
        run: node --check renderer.js importPipeline.js settings.js utils.js chordProcessing.js csmpnParser.js chordTheory.js importGuitarPro.js powerTabImporter.js musicXmlCore.js musicFont.js backupRestore.js audioPlayback.js abcSuite.js midiImport.js chordsheetPdf.js chordSlashMLRenderer.js

  # ── Deploy to GitHub Pages ───────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [test, build, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy static root files into dist
        run: |
          cp index.html settings.js renderer.js importPipeline.js \
             utils.js chordProcessing.js csmpnParser.js chordTheory.js importGuitarPro.js \
             powerTabImporter.js chordSlashMLRenderer.js musicXmlCore.js \
             musicFont.js backupRestore.js audioPlayback.js abcSuite.js midiImport.js chordsheetPdf.js ug-txt-importer.html dist/

      - name: Verify deploy assets (no referenced script is missing from dist)
        run: node scripts/verify-deploy-assets.mjs dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
